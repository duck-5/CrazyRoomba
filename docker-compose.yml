# =============================================================================
# Docker Compose for Roomba 960 Controller & Web Hub
# Multi-Architecture: Raspberry Pi (ARM64/ARMv7) & x86_64 Workstations
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Primary Service: Roomba Web Cockpit & Autonomy Controller (Hardware Mode)
  # Run: docker compose up -d
  # ---------------------------------------------------------------------------
  roomba:
    build:
      context: .
      dockerfile: Dockerfile
    image: roomba-controller:latest
    container_name: roomba-cockpit
    restart: unless-stopped
    ports:
      - "${ROOMBA_HTTP_PORT:-8000}:8000"
    environment:
      - ROOMBA_HOST=0.0.0.0
      - ROOMBA_HTTP_PORT=8000
      - ROOMBA_PORT=${ROOMBA_PORT:-}
      - ROOMBA_BAUDRATE=${ROOMBA_BAUDRATE:-115200}
      - ROOMBA_MODE=${ROOMBA_MODE:-Safe}
      - ROOMBA_MOCK=${ROOMBA_MOCK:-false}
      - ROOMBA_TELEMETRY_RATE_HZ=${ROOMBA_TELEMETRY_RATE_HZ:-7.0}
      - ROOMBA_BEHAVIOR_RATE_HZ=${ROOMBA_BEHAVIOR_RATE_HZ:-10.0}
      - ROOMBA_DEADMAN_TIMEOUT=${ROOMBA_DEADMAN_TIMEOUT:-0.5}
      - ROOMBA_CAMERA_ENABLED=${ROOMBA_CAMERA_ENABLED:-false}
      - ROOMBA_CAMERA_INDEX=${ROOMBA_CAMERA_INDEX:-0}
    # Privileged mode & /dev mount grant dynamic access to USB CDC ACM ports (/dev/ttyACM*) and cameras
    privileged: true
    volumes:
      - /dev:/dev
    group_add:
      - dialout
      - video
    # SD Card safety: rotate logs to prevent filling Raspberry Pi storage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Simulation Profile: Offline Mock Roomba (No Hardware Required)
  # Run: docker compose --profile mock up
  # ---------------------------------------------------------------------------
  roomba-mock:
    build:
      context: .
      dockerfile: Dockerfile
    image: roomba-controller:latest
    container_name: roomba-cockpit-mock
    profiles:
      - mock
    restart: "no"
    ports:
      - "${ROOMBA_HTTP_PORT:-8000}:8000"
    environment:
      - ROOMBA_HOST=0.0.0.0
      - ROOMBA_HTTP_PORT=8000
      - ROOMBA_MODE=Safe
      - ROOMBA_MOCK=true
      - ROOMBA_TELEMETRY_RATE_HZ=7.0
      - ROOMBA_BEHAVIOR_RATE_HZ=10.0
    command: ["web", "--host", "0.0.0.0", "--port", "8000", "--mock"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

  # ---------------------------------------------------------------------------
  # CLI Profile: Interactive Terminal WASD Teleoperation
  # Run: docker compose --profile teleop run --rm roomba-teleop
  # ---------------------------------------------------------------------------
  roomba-teleop:
    build:
      context: .
      dockerfile: Dockerfile
    image: roomba-controller:latest
    container_name: roomba-teleop
    profiles:
      - teleop
      - cli
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - /dev:/dev
    group_add:
      - dialout
    command: ["teleop", "--speed", "${ROOMBA_TELEOP_SPEED:-150}", "--mode", "${ROOMBA_MODE:-safe}"]
